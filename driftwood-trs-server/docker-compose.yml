name: driftwood-trs-server

services:
  postgres:
    image: postgres:16-alpine
    container_name: driftwood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "161189"
      POSTGRES_DB: driftwood
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: driftwood-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    # Local dev: falls back to the locally built image.
    # EC2/CI: IMAGE_URI is exported by deploy/scripts/start-app.sh from the artifact's image.env.
    image: ${IMAGE_URI:-driftwood-trs-server:latest}
    container_name: driftwood-trs-server

    # Tini init process — ensures SIGTERM reaches Node (no zombie processes)
    init: true

    restart: unless-stopped

    ports:
      - "${PORT:-8000}:8000"

    env_file:
      # EC2 deploy: deploy/scripts/start-app.sh fetches from Secrets Manager and writes this file
      - path: .env.secrets
        required: false
      # Local dev / staging: your local .env (never committed)
      - path: .env
        required: false

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # ECS / non-EC2 environments: set AWS_SECRET_ID to have the container fetch its own secrets.
      # On EC2, start-app.sh pre-fetches secrets into .env.secrets so this is not needed.
      # AWS_SECRET_ID: driftwood-trs/production
      # AWS_DEFAULT_REGION: us-east-1

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  redis-data:
